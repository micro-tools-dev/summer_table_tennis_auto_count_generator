<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115年管嶼國小桌球夏令營 - 費用計算機 V11</title>
    <style>
        :root {
            --primary-color: #1e3d59;
            --secondary-color: #17b978;
            --accent-color: #ff6f3c;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e1e8ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-color), #112233);
            color: white;
            padding: 25px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1.25fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 17px;
            color: var(--primary-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eef2f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
        }

        .identity-section {
            background: #edf2f7;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-color);
        }

        .checkbox-container input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }

        .batch-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .btn-mini {
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #cbd5e0;
            background: #ffffff;
            color: #4a5568;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-mini:hover {
            background: #edf2f7;
            border-color: #a0aec0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 14px;
        }

        th, td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f7fafc;
            color: #4a5568;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background-color: white;
            font-size: 13px;
        }

        .bill-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .bill-item.discount {
            color: #e53e3e;
            font-weight: bold;
        }

        .bill-item.bonus {
            color: #2b6cb0;
            font-size: 13px;
            background: #ebf8ff;
            padding: 6px 10px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 15px 0;
        }

        .total-amount {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .total-price {
            color: var(--accent-color);
            font-size: 26px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-success {
            background-color: var(--secondary-color);
            color: white;
        }
        .btn-success:hover { background-color: #129a63; }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { background-color: #12263a; }

        .text-preview {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            font-size: 13px;
            margin-top: 10px;
            max-height: 280px;
            overflow-y: auto;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 90%;
            max-height: 95%;
            overflow-y: auto;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }

        .modal-img-container {
            margin: 15px 0;
            border: 1px solid #ddd;
            background: #fcfcfc;
            padding: 5px;
            border-radius: 6px;
        }

        .modal-img-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .mobile-tip {
            background: #fff5f5;
            color: #c53030;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 1px solid #feb2b2;
        }

        #downloadCanvas {
            display: none;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>115年管嶼國小桌球夏令營</h1>
        <p style="opacity: 0.9; font-size: 14px; margin-top: 5px;">費用計算機 & 智慧暫存名冊系統 V11</p>
    </header>

    <div class="grid">
        <div>
            <div class="card">
                <div class="card-title">① 學員基本與繳費資訊</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 12px;">
                    <div>
                        <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:13px;">學生姓名</label>
                        <input type="text" id="studentName" value="王小明" style="width:100%; padding:8px; border:1px solid #cbd5e0; border-radius:6px;" oninput="calculateFee()">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:13px;">早鳥截止日期</label>
                        <input type="text" id="earlyBirdDate" value="115/6/17" style="width:100%; padding:8px; border:1px solid #cbd5e0; border-radius:6px;" oninput="calculateFee()">
                    </div>
                </div>
                <div class="identity-section">
                    <label class="checkbox-container">
                        <input type="checkbox" id="isTeamMember" onchange="calculateFee()">
                        該學員為「桌球隊成員」（若常規報滿 8 梯全天班享全單再打 85 折）
                    </label>
                </div>
            </div>

            <div class="card">
                <div class="card-title">② 選擇夏令營課程梯次</div>
                
                <div style="margin-bottom: 15px; padding: 12px; background: #fcf8f2; border-radius: 8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                        <span style="font-weight:bold; color:var(--primary-color); font-size:14px;">◆ 7/1 ~ 7/3 桌球體驗課程 (3天)</span>
                        <select id="experienceCourse" style="width:160px;" onchange="handleExperienceChange()">
                            <option value="none">不參加</option>
                            <option value="half">半天班 ($500)</option>
                            <option value="full">全天班 ($900)</option>
                        </select>
                    </div>
                    <div style="margin-top:10px; padding-top:8px; border-top:1px dashed #e2e8f0; display:flex; align-items:center;">
                        <label class="checkbox-container" style="font-size:13px; font-weight:normal; color:#4a5568;">
                            <input type="checkbox" id="lunch_exp" disabled onchange="calculateFee()" style="width:16px; height:16px; accent-color:var(--accent-color);">
                            加購體驗課代訂便當 (3天小計共 $255元)
                        </label>
                    </div>
                </div>

                <div class="batch-controls">
                    <span style="font-size:12px; color:#718096; display:flex; align-items:center; margin-right:5px;">⚡ 快捷操作：</span>
                    <button class="btn-mini" onclick="batchSelectSessions('full')">一鍵全選全天班</button>
                    <button class="btn-mini" onclick="batchSelectSessions('half')">一鍵全選半天班</button>
                    <button class="btn-mini" onclick="batchSelectSessions('none')">一鍵全部清除</button>
                    <button class="btn-mini" style="border-color: var(--secondary-color); color: var(--secondary-color);" onclick="batchSelectLunch(true)">一鍵全選訂便當</button>
                    <button class="btn-mini" style="border-color: #e53e3e; color: #e53e3e;" onclick="batchSelectLunch(false)">一鍵取消便當</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>梯次</th>
                            <th>課程日期</th>
                            <th>選擇班別</th>
                            <th>代訂便當 ($425/梯)</th>
                        </tr>
                    </thead>
                    <tbody id="sessionTableBody">
                        </tbody>
                </table>
            </div>

            <div class="card">
                <div class="card-title">③ 匯款帳號資料設定</div>
                <div style="display:grid; grid-template-columns:1fr 1fr 1.5fr; gap:10px;">
                    <div>
                        <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:13px;">銀行代碼</label>
                        <input type="text" id="bankCode" value="700" style="width:100%; padding:7px; border:1px solid #cbd5e0; border-radius:6px;" oninput="calculateFee()">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:13px;">戶名</label>
                        <input type="text" id="bankUser" value="張嘉芸" style="width:100%; padding:7px; border:1px solid #cbd5e0; border-radius:6px;" oninput="calculateFee()">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:5px; font-weight:bold; font-size:13px;">銀行帳號</label>
                        <input type="text" id="bankAccount" value="00812990126251" style="width:100%; padding:7px; border:1px solid #cbd5e0; border-radius:6px;" oninput="calculateFee()">
                    </div>
                </div>
            </div>
        </div>

        <div style="position: sticky; top: 20px;">
            <div class="card" style="border-top: 4px solid var(--primary-color);">
                <div class="card-title">④ 費用即時明細</div>
                <div id="billDetails"></div>
                <div class="divider"></div>
                <div class="total-amount">
                    <span>總計應繳</span>
                    <span class="total-price" id="totalPrice">NT$ 0</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">⑤ 家長通知與暫存紀錄</div>
                
                <div style="padding: 10px; background: #f0fdf4; border-radius: 6px; margin-bottom: 12px; border: 1px solid #bbf7d0;">
                    <label class="checkbox-container" style="font-size: 13px; color:#166534;">
                        <input type="checkbox" id="enableAutoRecord" checked style="accent-color: #166534;">
                        確認要紀錄：複製或產出圖片時，自動儲存此學員至名冊
                    </label>
                </div>

                <button class="btn btn-success" onclick="triggerCopyAction()">📋 複製完美排版通知文字</button>
                <button class="btn btn-primary" onclick="triggerImageAction()">🖼️ 產出/下載費用明細圖片</button>
                
                <div style="margin-top:12px; font-weight:bold; font-size:13px; color:var(--primary-color);">傳送文字效果預覽：</div>
                <div class="text-preview" id="textPreview"></div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top: 25px; border-top: 4px solid var(--secondary-color);">
        <div class="card-title">
            <span>📊 已暫存學員名冊管理後台</span>
            <div style="display:flex; gap:8px;">
                <button class="btn-mini" style="background: #4a5568; color: white; border: none; padding: 6px 12px;" onclick="copyBackupString()">🧩 複製名冊備份字串</button>
                <button class="btn-mini" style="background: #3182ce; color: white; border: none; padding: 6px 12px;" onclick="importBackupPrompt()">📥 匯入名冊備份</button>
                <button class="btn-mini" style="background: var(--secondary-color); color: white; border: none; padding: 6px 12px;" onclick="exportToExcelCSV()">📥 匯出 Excel 對帳總表</button>
            </div>
        </div>
        
        <div style="overflow-x: auto;">
            <table style="margin-top: 10px; font-size: 13px;">
                <thead>
                    <tr style="background: #edf2f7;">
                        <th>學生姓名</th>
                        <th>身分</th>
                        <th>體驗課</th>
                        <th>體驗課便當</th>
                        <th>常規選課摘要</th>
                        <th>便當總數</th>
                        <th>總計費用</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody">
                    </tbody>
            </table>
        </div>
        
        <div style="text-align: right; margin-top: 10px;">
            <button class="btn-mini" style="border-color:#e53e3e; color:#e53e3e;" onclick="clearAllRecords()">⚠️ 一鍵清空名冊</button>
        </div>
    </div>
</div>

<div class="modal" id="imageModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h3 style="color:var(--primary-color); margin-bottom:10px;">✨ 費用明細通知圖片已生成</h3>
        <div class="mobile-tip">📱 iPhone/手機用戶：請「長按圖片」選擇【儲存到照片】或直接分享！</div>
        <div class="modal-img-container">
            <img id="resultImage" src="" alt="費用明細收據">
        </div>
        <button class="btn btn-primary" id="pcDownloadBtn" style="margin-top:5px; width:auto; padding:8px 20px;">電腦版直接下載圖檔</button>
    </div>
</div>

<canvas id="downloadCanvas" width="650" height="1050"></canvas>
<div class="toast" id="toast">已複製到剪貼簿！</div>

<script>
    const sessions = [
        { id: 'A', date: '7/6 ~ 7/10' },
        { id: 'B', date: '7/13 ~ 7/17' },
        { id: 'C', date: '7/20 ~ 7/24' },
        { id: 'D', date: '7/27 ~ 7/31' },
        { id: 'E', date: '8/3 ~ 8/7' },
        { id: 'F', date: '8/10 ~ 8/14' },
        { id: 'G', date: '8/17 ~ 8/21' },
        { id: 'H', date: '8/24 ~ 8/28' }
    ];

    // 初始化表格
    const tbody = document.getElementById('sessionTableBody');
    sessions.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight:bold; color:var(--primary-color);">${s.id} 梯</td>
            <td style="color:#555;">${s.date}</td>
            <td>
                <select class="session-select" data-id="${s.id}" onchange="handleSessionChange('${s.id}')">
                    <option value="none">不參加</option>
                    <option value="half">半天班 ($1,250)</option>
                    <option value="full">全天班 ($2,500)</option>
                </select>
            </td>
            <td>
                <input type="checkbox" class="lunch-checkbox" data-id="${s.id}" id="lunch_${s.id}" disabled onchange="calculateFee()" style="width:17px; height:17px; accent-color:var(--accent-color);">
            </td>
        `;
        tbody.appendChild(tr);
    });

    function handleExperienceChange() {
        const expValue = document.getElementById('experienceCourse').value;
        const expLunchCheck = document.getElementById('lunch_exp');
        if (expValue === 'none') {
            expLunchCheck.checked = false;
            expLunchCheck.disabled = true;
        } else {
            expLunchCheck.disabled = false;
        }
        calculateFee();
    }

    function handleSessionChange(id) {
        const select = document.querySelector(`.session-select[data-id="${id}"]`);
        const lunchCheck = document.getElementById(`lunch_${id}`);
        if (select.value === 'none') {
            lunchCheck.checked = false;
            lunchCheck.disabled = true;
        } else {
            lunchCheck.disabled = false;
        }
        calculateFee();
    }

    function batchSelectSessions(type) {
        document.querySelectorAll('.session-select').forEach(select => {
            select.value = type;
            const id = select.getAttribute('data-id');
            const lunchCheck = document.getElementById(`lunch_${id}`);
            if (type === 'none') {
                lunchCheck.checked = false;
                lunchCheck.disabled = true;
            } else {
                lunchCheck.disabled = false;
            }
        });
        calculateFee();
    }

    function batchSelectLunch(checked) {
        document.querySelectorAll('.lunch-checkbox').forEach(cb => {
            if (!cb.disabled) {
                cb.checked = checked;
            }
        });
        const expLunchCheck = document.getElementById('lunch_exp');
        if (!expLunchCheck.disabled) {
            expLunchCheck.checked = checked;
        }
        calculateFee();
    }

    function compressSessions(selectedList) {
        if (selectedList.length === 0) return '';
        let result = [];
        let start = selectedList[0];
        let prev = selectedList[0];

        for (let i = 1; i < selectedList.length; i++) {
            let curr = selectedList[i];
            if (curr.charCodeAt(0) === prev.charCodeAt(0) + 1) {
                prev = curr;
            } else {
                if (start === prev) result.push(`${start}梯次`);
                else result.push(`${start}~${prev}梯次`);
                start = curr;
                prev = curr;
            }
        }
        if (start === prev) result.push(`${start}梯次`);
        else result.push(`${start}~${prev}梯次`);
        
        return result.join('、');
    }

    let globalCalculatedData = {};

    function calculateFee() {
        const name = document.getElementById('studentName').value || '各位';
        const earlyBird = document.getElementById('earlyBirdDate').value;
        const isTeamMember = document.getElementById('isTeamMember').checked;
        const expValue = document.getElementById('experienceCourse').value;
        const expLunchChecked = document.getElementById('lunch_exp').checked;

        let detailsHtml = '';
        let courseTotal = 0;
        let lunchTotal = 0;
        
        let halfList = [];
        let fullList = [];
        let lunchList = [];

        let expFee = 0;
        let expText = '';
        if (expValue === 'half') {
            expFee = 500;
            expText = '7/1~7/3 桌球體驗課程（半天班）：$500';
            detailsHtml += `<div class="bill-item"><span>7/1~7/3 體驗課程 (半天)</span><span>$500</span></div>`;
        } else if (expValue === 'full') {
            expFee = 900;
            expText = '7/1~7/3 桌球體驗課程（全天班）：$900';
            detailsHtml += `<div class="bill-item"><span>7/1~7/3 體驗課程 (全天)</span><span>$900</span></div>`;
        }
        courseTotal += expFee;

        sessions.forEach(s => {
            const select = document.querySelector(`.session-select[data-id="${s.id}"]`);
            const lunchCheck = document.getElementById(`lunch_${s.id}`);
            
            if (select.value === 'half') {
                halfList.push(s.id);
                courseTotal += 1250;
            } else if (select.value === 'full') {
                fullList.push(s.id);
                courseTotal += 2500;
            }

            if (!lunchCheck.disabled && lunchCheck.checked) {
                lunchList.push(s.id);
                lunchTotal += 425;
            }
        });

        let expLunchFee = 0;
        if (expLunchChecked && expValue !== 'none') {
            expLunchFee = 255;
            lunchTotal += expLunchFee;
            detailsHtml += `<div class="bill-item"><span>7/1~7/3 體驗課程代訂便當 (3天)</span><span>$255</span></div>`;
        }

        let simplifiedDetails = [];
        if (expText) simplifiedDetails.push(expText);
        if (expLunchFee > 0) simplifiedDetails.push(`7/1~7/3 體驗課程代訂便當：$255`);
        
        if (halfList.length > 0) {
            const compHalf = compressSessions(halfList);
            simplifiedDetails.push(`${compHalf} 訓練費用（半天班）：$1,250 x ${halfList.length}梯次 = $${(halfList.length * 1250).toLocaleString()}`);
        }
        if (fullList.length > 0) {
            const compFull = compressSessions(fullList);
            simplifiedDetails.push(`${compFull} 訓練費用（全天班）：$2,500 x ${fullList.length}梯次 = $${(fullList.length * 2500).toLocaleString()}`);
        }
        if (lunchList.length > 0) {
            const compLunch = compressSessions(lunchList);
            simplifiedDetails.push(`${compLunch} 常規代訂便當：$425 x ${lunchList.length}梯次 = $${(lunchList.length * 425).toLocaleString()}`);
        }

        if (courseTotal - expFee > 0) {
            detailsHtml += `<div class="bill-item"><span>常規梯次學費總計 (${halfList.length}半 / ${fullList.length}全)</span><span>$${courseTotal - expFee}</span></div>`;
        }
        if (lunchTotal - expLunchFee > 0) {
            detailsHtml += `<div class="bill-item"><span>常規代訂便當小計 (${lunchList.length}梯)</span><span>$${lunchTotal - expLunchFee}</span></div>`;
        }

        const equivalentFullSessions = fullList.length + Math.floor(halfList.length / 2);
        let multiSessionDiscount = 0;
        let bonuses = [];
        let freeExpGifted = false;

        // 【更新後的贈品邏輯核心】
        if (equivalentFullSessions >= 8) {
            multiSessionDiscount = 4000;
            freeExpGifted = true;
            bonuses.push("滿額好禮：運動襪一雙 + 桌球比賽球一盒 + 後背包一個");
        } else if (equivalentFullSessions >= 6) {
            multiSessionDiscount = 2200;
            freeExpGifted = true;
            bonuses.push("滿額好禮：桌球比賽球一盒");
        } else if (equivalentFullSessions >= 4) {
            multiSessionDiscount = 1000;
            freeExpGifted = true;
            bonuses.push("滿額好禮：運動襪一雙");
        } else if (equivalentFullSessions >= 2) {
            multiSessionDiscount = 200;
        }

        if (freeExpGifted) {
            if (expFee > 0) {
                multiSessionDiscount += expFee; 
                bonuses.unshift("滿額福利：符合資格！免收 7/1~7/3 體驗課程費用");
            } else {
                bonuses.unshift("滿額福利：符合資格！加贈 7/1~7/3 體驗課程免費 (上課前可向教練加選)");
            }
        }

        if (multiSessionDiscount > 0) {
            detailsHtml += `<div class="bill-item discount"><span>滿額多梯優惠折抵</span><span>-$${multiSessionDiscount}</span></div>`;
        }

        let teamDiscount = 0;
        let subtotalAfterMulti = Math.max(0, courseTotal - multiSessionDiscount);
        if (isTeamMember && fullList.length === 8) {
            teamDiscount = Math.round(subtotalAfterMulti * 0.15);
            detailsHtml += `<div class="bill-item discount"><span>球隊專屬全天班 85 折大特惠</span><span>-$${teamDiscount}</span></div>`;
        }

        let finalTotal = subtotalAfterMulti - teamDiscount + lunchTotal;

        bonuses.forEach(b => {
            detailsHtml += `<div class="bill-item bonus">${b}</div>`;
        });

        document.getElementById('billDetails').innerHTML = detailsHtml || '<div style="color:#aaa; text-align:center; padding:10px;">未勾選任何項目</div>';
        document.getElementById('totalPrice').innerText = `NT$ ${finalTotal.toLocaleString()}`;

        const bankCode = document.getElementById('bankCode').value;
        const bankUser = document.getElementById('bankUser').value;
        const bankAccount = document.getElementById('bankAccount').value;

        let txt = `${name}家長您好：\n\n☀️ 夏令營費用說明 ☀️\n\n`;
        simplifiedDetails.forEach(line => {
            txt += `🏓 ${line}\n`;
        });
        
        if (multiSessionDiscount > 0) {
            txt += `🉐 滿額多梯優惠折抵：-$${multiSessionDiscount}\n`;
        }
        if (teamDiscount > 0) {
            txt += `🏆 桌球隊專屬優惠 (85折)：-$${teamDiscount}\n`;
        }
        if (bonuses.length > 0) {
            txt += `\n✨ 【滿額超值贈品/福利清單】\n`;
            bonuses.forEach(b => { txt += `  🎁 ${b}\n`; });
        }

        txt += `\n💰 總計金額：$${finalTotal.toLocaleString()}元\n`;
        txt += `\n⸻\n\n💳 繳費方式（二擇一）\n\n`;
        txt += `✅ 轉帳繳費（請註明學生姓名）\n`;
        txt += `   戶名：${bankUser}\n`;
        txt += `   銀行代碼：${bankCode}\n`;
        txt += `   帳號：${bankAccount}\n\n`;
        txt += `✅ 現金繳費（至桌球教室）\n\n⸻\n\n`;
        txt += `🎁 溫馨提醒：\n凡於 ${earlyBird} 前完成報名繳費者，「早鳥禮物」將於上課第一天贈送唷！\n\n感謝您的支持與參加 ❤️`;

        document.getElementById('textPreview').innerText = txt;

        globalCalculatedData = {
            name: name,
            isTeam: isTeamMember ? '桌球隊' : '一般生',
            expType: expValue === 'none' ? '不參加' : (expValue === 'half' ? '半天班' : '全天班'),
            expLunch: expLunchChecked ? '有訂便當' : '無',
            summarySessions: (halfList.length > 0 ? compressSessions(halfList)+'(半)' : '') + (fullList.length > 0 ? ' ' + compressSessions(fullList)+'(全)' : '') || '無',
            lunchCount: lunchList.length,
            simplifiedLines: simplifiedDetails,
            multiDiscount: multiSessionDiscount,
            teamDiscount: teamDiscount,
            bonuses: bonuses,
            total: finalTotal,
            bankCode: bankCode,
            bankUser: bankUser,
            bankAccount: bankAccount,
            earlyBird: earlyBird
        };
    }

    function saveCurrentRecordToStorage() {
        if (!document.getElementById('enableAutoRecord').checked) return;
        
        let records = JSON.parse(localStorage.getItem('tableTennisCampRecords') || '[]');
        const d = globalCalculatedData;
        
        const index = records.findIndex(r => r.name === d.name);
        const recordData = {
            name: d.name,
            isTeam: d.isTeam,
            expType: d.expType,
            expLunch: d.expLunch,
            summarySessions: d.summarySessions,
            lunchCount: d.lunchCount,
            total: d.total
        };

        if (index > -1) {
            records[index] = recordData;
        } else {
            records.push(recordData);
        }

        localStorage.setItem('tableTennisCampRecords', JSON.stringify(records));
        renderRecordsTable();
    }

    function renderRecordsTable() {
        let records = JSON.parse(localStorage.getItem('tableTennisCampRecords') || '[]');
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = '';

        if (records.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="color:#aaa; text-align:center; padding:15px;">目前名冊內暫無學員資料</td></tr>`;
            return;
        }

        records.forEach((r, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:bold; color:var(--primary-color);">${r.name}</td>
                <td><span style="font-size:12px; padding:2px 6px; border-radius:4px; background:${r.isTeam==='桌球隊'?'#fef3c7':'#edf2f7'}; color:${r.isTeam==='桌球隊'?'#92400e':'#4a5568'};">${r.isTeam}</span></td>
                <td>${r.expType}</td>
                <td>${r.expLunch}</td>
                <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${r.summarySessions}</td>
                <td>${r.lunchCount} 梯</td>
                <td style="font-weight:bold; color:var(--accent-color);">$${r.total.toLocaleString()}</td>
                <td><button class="btn-mini" style="color:#e53e3e; border-color:#fed7d7; background:#fff5f5;" onclick="deleteRecord(${idx})">❌ 刪除</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteRecord(idx) {
        let records = JSON.parse(localStorage.getItem('tableTennisCampRecords') || '[]');
        records.splice(idx, 1);
        localStorage.setItem('tableTennisCampRecords', JSON.stringify(records));
        renderRecordsTable();
        showToast('❌ 已從名冊中移除該學員');
    }

    // 完整的匯入與匯出資料備份機制
    function clearAllRecords() {
        if (confirm('⚠️ 您確定要清空後台所有的學員名冊紀錄嗎？此動作無法復原。')) {
            localStorage.removeItem('tableTennisCampRecords');
            renderRecordsTable();
            showToast('⚠️ 名冊已全數清空');
        }
    }

    function copyBackupString() {
        let records = localStorage.getItem('tableTennisCampRecords');
        if (!records || records === '[]') {
            alert('目前後台名冊空空的，沒有資料可以備份唷！');
            return;
        }
        navigator.clipboard.writeText(records).then(() => {
            showToast('🧩 名冊 JSON 備份文字已複製！');
            alert('備份成功！名冊文字已複製到您的剪貼簿。\\n您可以將這段文字存在您的 LINE 或備忘錄中，未來要還原或換電腦時貼上即可！');
        });
    }

    function importBackupPrompt() {
        let code = prompt('請貼上您先前複製的「🧩 名冊備份文字 (JSON 格式)」：');
        if (!code) return;
        try {
            let parsed = JSON.parse(code.trim());
            if (Array.isArray(parsed)) {
                if (confirm(`確認匯入？這將會合併或更新現有的學員名冊（共 ${parsed.length} 筆資料）。`)) {
                    let existing = JSON.parse(localStorage.getItem('tableTennisCampRecords') || '[]');
                    parsed.forEach(newRec => {
                        let idx = existing.findIndex(e => e.name === newRec.name);
                        if (idx > -1) {
                            existing[idx] = newRec;
                        } else {
                            existing.push(newRec);
                        }
                    });
                    localStorage.setItem('tableTennisCampRecords', JSON.stringify(existing));
                    renderRecordsTable();
                    calculateFee();
                    showToast('🎉 名冊資料已智慧還原成功！');
                }
            } else {
                alert('抱歉，格式錯誤，請確保您貼上的是完整的備份文字。');
            }
        } catch (e) {
            alert('匯入失敗！這段字串並非正確的名冊格式，請重新複製正確的備份文字。');
        }
    }

    function exportToExcelCSV() {
        let records = JSON.parse(localStorage.getItem('tableTennisCampRecords') || '[]');
        if (records.length === 0) {
            alert('目前名冊內尚無任何學員資料可以匯出喔！');
            return;
        }

        let csvContent = "\uFEFF"; 
        csvContent += "學生姓名,身分,7/1~7/3體驗課程,體驗課代訂便當,常規選課摘要,常規便當總數,總計應繳費用\n";

        records.forEach(r => {
            csvContent += `"${r.name}","${r.isTeam}","${r.expType}","${r.expLunch}","${r.summarySessions}","${r.lunchCount}梯次",${r.total}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `115年桌球夏令營學員報名總表_${new Date().toISOString().slice(0,10)}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('📊 Excel總表 (CSV) 已成功下載！');
    }

    function triggerCopyAction() {
        copyNotificationText();
        saveCurrentRecordToStorage();
    }

    function triggerImageAction() {
        generateAndShowImage();
        saveCurrentRecordToStorage();
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    function copyNotificationText() {
        const text = document.getElementById('textPreview').innerText;
        navigator.clipboard.writeText(text).then(() => {
            showToast('📋 通知文字已完美複製！');
        }).catch(() => {
            showToast('複製失敗，請手動複製預覽區文字');
        });
    }

    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    // Canvas 高畫質無裁切繪製邏輯
    function generateAndShowImage() {
        const canvas = document.getElementById('downloadCanvas');
        const ctx = canvas.getContext('2d');
        const d = globalCalculatedData;

        let baseHeight = 560;
        let linesCount = d.simplifiedLines.length;
        let bonusCount = d.bonuses.length;
        let computedHeight = baseHeight + (linesCount * 32) + (bonusCount * 28);
        canvas.height = Math.max(950, computedHeight);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1e3d59';
        ctx.fillRect(0, 0, canvas.width, 115);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('115年 管嶼國小桌球夏令營', canvas.width / 2, 50);
        
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#eef2f5';
        ctx.fillText('— 學生報名費用明細與繳費通知單 —', canvas.width / 2, 85);

        ctx.textAlign = 'left';
        ctx.fillStyle = '#111111';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(`${d.name} 家長您好：`, 45, 155);

        ctx.strokeStyle = '#cbd5e0';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(45, 175); ctx.lineTo(605, 175); ctx.stroke();

        let currentY = 210;
        ctx.fillStyle = '#1e3d59';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText('🏓 夏令營選課與代訂費用明細', 45, currentY);
        
        currentY += 15;
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#333333';
        
        if (d.simplifiedLines.length === 0) {
            ctx.fillStyle = '#718096';
            ctx.fillText('（尚未選取任何課程或便當項目）', 60, currentY + 25);
            currentY += 40;
        } else {
            d.simplifiedLines.forEach(line => {
                currentY += 32;
                ctx.fillText(`🏓 ${line}`, 60, currentY);
            });
        }

        if (d.multiDiscount > 0 || d.teamDiscount > 0 || d.bonuses.length > 0) {
            currentY += 35;
            ctx.strokeStyle = '#e2e8f0';
            ctx.beginPath(); ctx.moveTo(45, currentY - 15); ctx.lineTo(605, currentY - 15); ctx.stroke();

            if (d.multiDiscount > 0) {
                ctx.fillStyle = '#e53e3e';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText(`🉐 滿額多梯優惠折抵: -$${d.multiDiscount.toLocaleString()}`, 60, currentY);
                currentY += 28;
            }
            if (d.teamDiscount > 0) {
                ctx.fillStyle = '#e53e3e';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText(`🏆 桌球隊專屬優惠 (常規8全打85折): -$${d.teamDiscount.toLocaleString()}`, 60, currentY);
                currentY += 28;
            }
            if (d.bonuses.length > 0) {
                ctx.fillStyle = '#2b6cb0';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('✨ 獲得滿額福利與精美好禮：', 60, currentY);
                currentY += 5;
                
                d.bonuses.forEach(b => {
                    currentY += 26;
                    ctx.font = '13px sans-serif';
                    ctx.fillStyle = '#4a5568';
                    ctx.fillText(`  🎁 ${b}`, 60, currentY);
                });
            }
        }

        currentY += 30;
        ctx.strokeStyle = '#1e3d59';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(45, currentY); ctx.lineTo(605, currentY); ctx.stroke();

        currentY += 42;
        ctx.fillStyle = '#1e3d59';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('💰 總計應繳金額：', 45, currentY);
        
        ctx.fillStyle = '#ff6f3c';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`$${d.total.toLocaleString()} 元`, 605, currentY + 4);

        ctx.textAlign = 'left';
        currentY += 35;
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(45, currentY, 560, 140);
        ctx.strokeStyle = '#cbd5e0';
        ctx.lineWidth = 1;
        ctx.strokeRect(45, currentY, 560, 140);

        ctx.fillStyle = '#1e3d59';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('💳 繳費方式說明（二擇一）', 60, currentY + 30);
        
        ctx.font = '13px sans-serif';
        ctx.fillStyle = '#4a5568';
        ctx.fillText(`✅ 轉帳繳費 — 銀行代碼: ${d.bankCode}  |  戶名: ${d.bankUser}`, 60, currentY + 62);
        ctx.fillText(`               帳號: ${d.bankAccount} (請務必註明學生姓名)`, 60, currentY + 84);
        ctx.fillText('✅ 現金繳費 — 請直接至學校活動中心 3 樓桌球教室繳交給教練', 60, currentY + 114);

        currentY += 185;
        ctx.fillStyle = '#ff6f3c';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`💡 溫馨提醒：凡於 ${d.earlyBird} 前完成報名繳費者，「早鳥禮物」將於上課第一天贈送唷！`, 45, currentY);
        
        ctx.fillStyle = '#718096';
        ctx.font = '12px sans-serif';
        ctx.fillText('感謝您的支持與配合，讓我們陪伴孩子度過充滿活力又充實的暑假！ ❤️', 45, currentY + 26);

        const imgUrl = canvas.toDataURL('image/png');
        document.getElementById('resultImage').src = imgUrl;
        document.getElementById('imageModal').style.display = 'flex';

        document.getElementById('pcDownloadBtn').onclick = function() {
            const link = document.createElement('a');
            link.download = `${d.name}_桌球夏令營費用明細單.png`;
            link.href = imgUrl;
            link.click();
        };
    }

    renderRecordsTable();
    calculateFee();
</script>

</body>
